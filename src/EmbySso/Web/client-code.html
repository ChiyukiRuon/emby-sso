<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>客户端登录码</title>
    <link rel="stylesheet" href="{{BASE}}/sso/assets/portal.css">
    <script defer src="{{BASE}}/sso/assets/client-code.js"></script>
</head>
<body>
    <main>
        <h1>登录电脑或电视客户端</h1>
        <p>在客户端手动添加服务器，然后填写下方用户名，并把登录码填入密码框。</p>
        <p>服务器：<strong>{{BASE}}</strong></p>
        <p>用户名：<strong id="username"></strong></p>
        <p>一次性登录码：<strong id="login-code"></strong></p>
        <p id="expiry" role="status">登录码有效期为 5 分钟，仅可使用一次。重新生成后旧码立即失效。</p>
        <p>这是临时密码，不是 Emby Connect 的 PIN 码。登录成功后由客户端保存会话；再次登录时请获取新码。</p>
        <p><a href="{{BASE}}/sso">返回并重新获取登录码</a></p>
    </main>
    <script id="bootstrap" type="application/json">{{DATA}}</script>
</body>
</html>
