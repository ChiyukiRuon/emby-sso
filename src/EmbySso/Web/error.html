<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{TITLE}} · Emby SSO</title>
    <link rel="stylesheet" href="{{BASE}}/sso/assets/portal.css">
</head>
<body>
    <main class="panel error-panel">
        <div class="eyebrow">EMBY · SINGLE SIGN-ON</div>
        <div class="status-icon" aria-hidden="true">!</div>
        <h1>{{TITLE}}</h1>
        <p id="error-message" role="alert">{{MESSAGE}}</p>
        <a class="button-link" id="error-action" href="{{TARGET}}">{{ACTION}}</a>
        <p class="footnote">如果问题持续出现，请联系管理员检查 SSO 配置。</p>
    </main>
</body>
</html>
